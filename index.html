<!DOCTYPE html>
<html>
<head>
  <title>Class Results Dashboard</title>

  <style>
    body {
      font-family: Arial;
      background: #f4f6f9;
      text-align: center;
    }

    h1 {
      background: #2d6cdf;
      color: white;
      padding: 15px;
      margin: 0;
    }

    .container {
      margin: 20px auto;
      width: 350px;
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 10px gray;
    }

    input {
      width: 90%;
      padding: 8px;
      margin: 5px;
    }

    button {
      padding: 8px;
      width: 95%;
      background: green;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 10px;
    }

    table {
      width: 90%;
      margin: 20px auto;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid black;
      padding: 8px;
    }

    th {
      background: black;
      color: white;
    }

    .A { color: green; font-weight: bold; }
    .B { color: blue; font-weight: bold; }
    .C { color: orange; font-weight: bold; }
    .F { color: red; font-weight: bold; }

    .delete {
      background: red;
      color: white;
      border: none;
      padding: 5px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h1>📊 Class Results Dashboard</h1>

<div class="container">
  <input type="text" id="name" placeholder="Student Name">
  <input type="number" id="math" placeholder="Math Marks">
  <input type="number" id="science" placeholder="Science Marks">
  <input type="number" id="english" placeholder="English Marks">

  <button onclick="addStudent()">Add Result</button>
</div>

<table id="table">
  <tr>
    <th>Name</th>
    <th>Total</th>
    <th>%</th>
    <th>Grade</th>
    <th>Action</th>
  </tr>
</table>

<script>
  let students = [];

  function addStudent() {
    let name = document.getElementById("name").value;
    let m = Number(document.getElementById("math").value);
    let s = Number(document.getElementById("science").value);
    let e = Number(document.getElementById("english").value);

    if (!name) return alert("Enter name");

    let total = m + s + e;
    let percent = total / 3;

    let grade = "";

    if (percent >= 80) grade = "A";
    else if (percent >= 60) grade = "B";
    else if (percent >= 40) grade = "C";
    else grade = "F";

    let student = { name, total, percent, grade };

    students.push(student);
    display();
    clearInputs();
  }

  function display() {
    let table = document.getElementById("table");

    table.innerHTML = `
      <tr>
        <th>Name</th>
        <th>Total</th>
        <th>%</th>
        <th>Grade</th>
        <th>Action</th>
      </tr>
    `;

    students.forEach((s, i) => {
      table.innerHTML += `
        <tr>
          <td>${s.name}</td>
          <td>${s.total}</td>
          <td>${s.percent.toFixed(2)}%</td>
          <td class="${s.grade}">${s.grade}</td>
          <td><button class="delete" onclick="remove(${i})">Delete</button></td>
        </tr>
      `;
    });
  }

  function remove(i) {
    students.splice(i, 1);
    display();
  }

  function clearInputs() {
    document.getElementById("name").value = "";
    document.getElementById("math").value = "";
    document.getElementById("science").value = "";
    document.getElementById("english").value = "";
  }
</script>

</body>
</html>
